spring:
  application:
    name: civic-saathi-backend
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/Civic}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    hikari:
      connection-timeout: 20000
      maximum-pool-size: ${DB_MAX_POOL_SIZE:3}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:false}
        show_sql: ${HIBERNATE_SHOW_SQL:false}
        jdbc:
          time_zone: UTC

  jackson:
    time-zone: UTC

server:
  port: ${PORT:${SERVER_PORT:8080}}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.springframework.security: ${LOG_LEVEL_SECURITY:INFO}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:WARN}
    org.hibernate.type.descriptor.sql.BasicBinder: ${LOG_LEVEL_SQL_BINDER:WARN}
    com.zaxxer.hikari: DEBUG

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-for-production-min-32-bytes}
    access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
    refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

ai:
  cerebras:
    api-key: ${CEREBRAS_API_KEY:}
    model: ${CEREBRAS_MODEL:llama3.1-8b}
    max-tokens: ${CEREBRAS_MAX_TOKENS:512}
  openrouter:
    api-key: ${OPENROUTER_API_KEY:}
    vision-model: ${OPENROUTER_VISION_MODEL:google/gemma-4-26b-a4b-it}
    fallback-model: ${OPENROUTER_FALLBACK_MODEL:nemotron-nano-12b-v2-vl}
    max-tokens: ${OPENROUTER_MAX_TOKENS:512}
