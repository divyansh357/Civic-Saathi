spring:
  application:
    name: civic-saathi-backend
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]

  datasource:
    # Connects to the pgAdmin-managed PostgreSQL database.
    # PostGIS extension must be enabled in that DB (run: CREATE EXTENSION IF NOT EXISTS postgis;)
    url: ${DB_URL:jdbc:postgresql://localhost:5432/Civic}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
        # Hibernate 6 auto-detects PostGIS dialect — no explicit dialect needed.
        # If you see dialect warnings, you can set:
        # dialect: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: INFO

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-for-production-min-32-bytes}
    access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
    refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}
