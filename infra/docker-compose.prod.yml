services:
  # ── PostgreSQL with PostGIS ──────────────────────────────────────────────────
  postgres:
    build:
      context: ..
      dockerfile: infra/docker/postgres.Dockerfile
    container_name: civic_postgres_prod
    env_file:
      - ../.env
    volumes:
      - civic_pg_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    # No port exposure in production — only accessible within Docker network

  # ── Spring Boot Backend ──────────────────────────────────────────────────────
  backend:
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    container_name: civic_backend_prod
    env_file:
      - ../.env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-Civic}
      JPA_DDL_AUTO: validate
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Nginx Reverse Proxy ──────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: civic_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - civic_web_dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: always

volumes:
  civic_pg_data_prod:
  civic_web_dist:
