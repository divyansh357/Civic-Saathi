services:
  # ── PostgreSQL with PostGIS ──────────────────────────────────────────────────
  # This container provides the PostGIS extension.
  # The database itself is managed via pgAdmin on the host.
  # POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD must match your pgAdmin setup.
  postgres:
    build:
      context: ..
      dockerfile: infra/docker/postgres.Dockerfile
    container_name: civic_postgres
    env_file:
      - ../.env
    ports:
      - "5432:5432"
    volumes:
      - civic_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Spring Boot Backend ──────────────────────────────────────────────────────
  # DB_URL in .env should point to the pgAdmin-managed database.
  # When running locally (not in Docker), the backend reads .env directly and
  # connects to localhost:5432 — the same postgres instance pgAdmin manages.
  backend:
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    container_name: civic_backend
    env_file:
      - ../.env
    environment:
      # Override DB_URL inside Docker to use the postgres service name
      DB_URL: jdbc:postgresql://postgres:5432/Civic
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  civic_pg_data:
