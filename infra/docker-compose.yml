services:
  postgres:
    build:
      context: ..
      dockerfile: infra/docker/postgres.Dockerfile
    container_name: civic_postgres
    env_file:
      - ../.env
    ports:
      - "5432:5432"
    volumes:
      - civic_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    container_name: civic_backend
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  civic_pg_data:
